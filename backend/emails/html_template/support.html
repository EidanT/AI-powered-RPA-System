<html>
    <body style="margin:0; padding:0; background:#f0f2f5; font-family: Arial, sans-serif;">
        <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2f5; padding:30px 0;">
            <tr><td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
                <!-- Header -->
                <tr>
                <td style="background:#1a5e3a; padding:28px 32px;">
                    <p style="margin:0; color:#a8d4b8; font-size:12px; text-transform:uppercase; letter-spacing:1px;">Technical Support</p>
                    <h1 style="margin:6px 0 0; color:#ffffff; font-size:22px; font-weight:600;">Ticket #{{ticket_id}}</h1>
                </td>
                </tr>
                <!-- Status badge -->
                <tr>
                <td style="padding:20px 32px 0;">
                    <span style="display:inline-block; background:#fff3cd; color:#856404; font-size:12px; font-weight:600; padding:4px 14px; border-radius:20px;">⏳ En proceso</span>
                </td>
                </tr>
                <!-- Body -->
                <tr>
                    <td style="padding:20px 32px 32px;">
                        <p style="margin:0 0 16px; color:#444; font-size:15px;">Hi <strong>{{name}}</strong>,</p>
                        <p style="margin:0 0 20px; color:#555; font-size:15px; line-height:1.7;">We have received your support request. Here is a summary:</p>
                        <!-- Message preview -->
                        <table width="100%" cellpadding="0" cellspacing="0" style="background:#f9f9f9; border:1px solid #e8e8e8; border-radius:6px; margin-bottom:24px;">
                        <tr>
                            <td style="padding:16px 20px;">
                            <p style="margin:0 0 8px; font-size:12px; color:#888; text-transform:uppercase; letter-spacing:0.5px;">Received message</p>
                            <p style="margin:0; color:#444; font-size:14px; line-height:1.6; font-style:italic;">"{{problem_message}}"</p>
                            </td>
                        </tr>
                        </table>
                    </td>
                </tr>
                <!-- Footer -->
                <tr>
                <td style="background:#f9f9f9; padding:20px 32px; border-top:1px solid #eeeeee;">
                    <p style="margin:0 0 4px; color:#aaa; font-size:12px;">Estimated response time: <strong style="color:#888;">24-48 business hours</strong></p>
                    <p style="margin:0; color:#aaa; font-size:12px;">This message was automatically generated. Please do not respond directly.</p>
                </td>
                </tr>
            </table>
            </td></tr>
        </table>
    </body>
</html>
